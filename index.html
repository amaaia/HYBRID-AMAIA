/* chat */
#chat{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
.chat-h{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}.chat-t{flex:1;min-width:0}.chat-t b{display:block;font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-t span{font-size:12px}
.chat-m{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:720px;width:100%;margin:0 auto}
.bub{max-width:88%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.5}.bub p{margin:0 0 8px}.bub p:last-child{margin:0}.bub ul{margin:4px 0 8px;padding-left:20px}.bub.u{align-self:flex-end;background:linear-gradient(135deg,#ff7a59,#ffb36b);color:#2a1a14;border-bottom-right-radius:6px}.bub.a{align-self:flex-start;background:var(--card);box-shadow:var(--sh);border-bottom-left-radius:6px}
.typing{display:flex;gap:5px;padding:14px 16px}.typing i{width:8px;height:8px;border-radius:50%;background:var(--mut);animation:tp 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}@keyframes tp{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.prop{align-self:stretch;background:var(--card);border-radius:16px;padding:12px 14px;border-left:5px solid var(--co);box-shadow:var(--sh)}.prop.applied{border-left-color:var(--ok)}.prop.dismissed,.prop.undone{opacity:.65;border-left-color:var(--line)}.prop.warn{border-left-color:var(--warn)}
.chat-c{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}.cbox{display:flex;gap:8px;align-items:flex-end;max-width:720px;margin:0 auto}.cbox textarea{resize:none;border-radius:20px;padding:11px 14px;max-height:140px}.csend{flex:none;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ff7a59,#ffb36b);color:#2a1a14;font-size:18px}
.chat-empty{margin:auto;text-align:center;max-width:420px;color:var(--mut)}.chat-empty .chips{justify-content:center;margin-top:12px}.chat-empty .chip{font-size:14px;text-align:left}
#fab{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#ff7a59,#ffb36b);box-shadow:0 8px 24px rgba(255,122,89,.45);font-size:24px}
</style></head><body>

function metricChart(a,key){if(!a.length)return'';const W=340,H=182,L=38,R=12,T=16,B=30,m=METRICS[key],vals=a.map(x=>x.v),mn=Math.min(...vals),mx=Math.max(...vals),pad=(mx-mn||Math.max(1,mx*.08))*.14,lo=mn-pad,hi=mx+pad,t0=dt(a[0].date),t1=dt(a.at(-1).date),X=d=>L+(dt(d)-t0)/Math.max(864e5,t1-t0)*(W-L-R),Y=v=>T+(m.invert?(v-lo)/(hi-lo):(hi-v)/(hi-lo))*(H-T-B),pts=a.map(x=>`${X(x.date).toFixed(1)},${Y(x.v).toFixed(1)}`).join(' '),av=avg(vals),af=v=>key==='runpace'?mmss(v):n1(v);return`<svg class="metric-chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución de ${esc(m.title)}"><line x1="${L}" x2="${W-R}" y1="${Y(av)}" y2="${Y(av)}" style="stroke:var(--line);stroke-dasharray:4 4"/><polyline fill="none" points="${pts}" style="stroke:var(--run);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/>${a.map(x=>`<circle cx="${X(x.date)}" cy="${Y(x.v)}" r="3.2" style="fill:var(--run);stroke:var(--card);stroke-width:2"><title>${fd(x.date,{day:'numeric',month:'short',year:'numeric'})}: ${metricFmt(key,x.v)}</title></circle>`).join('')}<text x="${L-5}" y="${Y(mx)+4}" text-anchor="end" style="fill:var(--mut);font-size:10px">${af(mx)}</text><text x="${L-5}" y="${Y(mn)+4}" text-anchor="end" style="fill:var(--mut);font-size:10px">${af(mn)}</text><text x="${L}" y="${H-7}" style="fill:var(--mut);font-size:10px">${fd(a[0].date,{day:'numeric',month:'short'})}</text><text x="${W-R}" y="${H-7}" text-anchor="end" style="fill:var(--mut);font-size:10px">${fd(a.at(-1).date,{day:'numeric',month:'short'})}</text></svg>`}

/* interfaz del chat */
const SUG={general:['Estoy en el gimnasio, ¿qué hago hoy?','¿Cómo voy de cara a la próxima carrera?','Revisa mi semana y ajusta lo que haga falta','Tengo una molestia y no sé si entrenar'],ses:['¿Qué tal ha ido esta sesión?','Hoy me he sentido…','¿Cómo la afronto?','No he podido hacerla entera']};
function openChat(scope){CSCOPE=scope||'general';CERR='';const s=CSCOPE!=='general'&&byId(CSCOPE);$('#chat').style.display='flex';$('#chat').innerHTML=`<div class="chat-h"><button class="acct" data-chat-close>‹ Volver</button><div class="chat-t"><b>${s?esc(s.title.replace(/^S\d+\s*·\s*/,'')):'Tu entrenador'}</b><span class="mut">${s?fd(s.date)+' · comentando esta sesión':'Conoce tu plan y tus entrenos'}</span></div><button class="acct" data-chat-clear aria-label="Borrar conversación">🗑</button></div><div id="cmsgs" class="chat-m"></div><div class="chat-c"><div class="cbox"><textarea id="cin" rows="1" placeholder="Escribe al entrenador…"></textarea><button class="csend" data-chat-send aria-label="Enviar">➤</button></div></div>`;chatMsgs();const ta=$('#cin');ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(140,ta.scrollHeight)+'px'};ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();doSend()}}}
function chatMsgs(typing){const el=$('#cmsgs');if(!el)return;const ms=CHAT.filter(m=>m.scope===CSCOPE);let h='';
 if(!ms.length)h+=`<div class="chat-empty"><div style="font-size:34px">💬</div><p>Cuéntame cómo ha ido, pregúntame lo que quieras o pídeme que ajuste tus próximas sesiones.</p><div class="chips">${SUG[CSCOPE==='general'?'general':'ses'].map((x,i)=>`<button class="chip" data-chat-sug="${i}">${esc(x)}</button>`).join('')}</div></div>`;
 ms.forEach(m=>{if(m.role==='user')h+=`<div class="bub u">${esc(m.content).replace(/\n/g,'<br>')}</div>`;else{h+=`<div class="bub a">${md(m.content)}</div>`;(m.props||[]).forEach((p,i)=>{h+=`<div class="prop ${p.status}"><div class="mut" style="font-size:12px">Cambio propuesto</div><b>${esc(propText(p))}</b>${p.reason?`<p class="mut" style="margin:4px 0 8px">${esc(p.reason)}</p>`:''}${p.status==='pending'?`<div class="k"><button class="btn sm" data-prop="${m.id}|${i}|apply">Aplicar</button><button class="btn ghost sm" data-prop="${m.id}|${i}|dismiss">Descartar</button></div>`:p.status==='applied'?`<span class="tag" style="color:var(--ok)">✓ Aplicado</span> <button class="acct" data-prop="${m.id}|${i}|undo">Deshacer</button>`:`<span class="tag">${p.status==='undone'?'Deshecho':'Descartado'}</span>`}</div>`})}});
 if(typing||CBUSY)h+='<div class="bub a typing"><i></i><i></i><i></i></div>';if(CERR)h+=`<div class="prop warn"><b>No he podido responder</b><p class="mut" style="margin:4px 0 0">${esc(CERR)}</p></div>`;
 el.innerHTML=h;el.scrollTop=el.scrollHeight}
async function errText(e){try{if(e&&e.context&&e.context.json){const j=await e.context.json();if(j&&j.error)return j.error}}catch(x){}const m=String(e&&e.message||e);return/Failed to send|not found|404|FunctionsFetch|NetworkError/i.test(m)?'No llego al servicio del entrenador. Comprueba que la función coach-chat está desplegada en Supabase y que has iniciado sesión.':m}
async function doSend(txt){const ta=$('#cin');txt=(txt!=null?txt:ta&&ta.value||'').trim();if(!txt||CBUSY)return;if(!user){CERR='Inicia sesión para hablar con el entrenador.';chatMsgs();return}if(ta){ta.value='';ta.style.height='auto'}CERR='';
 const m={id:uid(),scope:CSCOPE,role:'user',content:txt,t:Date.now()};CHAT.push(m);saveChat();pushMsg(m);CBUSY=true;chatMsgs();
 const msgs=CHAT.filter(x=>x.scope===CSCOPE).slice(-20).map(x=>({role:x.role,content:x.content+((x.props||[]).length?'\n[Cambios propuestos: '+x.props.map(p=>propText(p)+' ('+p.status+')').join('; ')+']':'')}));
 try{const {data,error}=await sb.functions.invoke('coach-chat',{body:{messages:msgs,context:buildCtx(CSCOPE),scope:CSCOPE}});if(error)throw error;if(data&&data.error)throw new Error(data.error);const a={id:uid(),scope:CSCOPE,role:'assistant',content:data.reply||'(sin respuesta)',t:Date.now(),props:(data.proposals||[]).slice(0,6).map(p=>({...p,status:'pending'}))};if(!a.props.length)delete a.props;CHAT.push(a);saveChat();pushMsg(a)}catch(e){CERR=await errText(e)}
 CBUSY=false;chatMsgs()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-chat-open],[data-chat-close],[data-chat-send],[data-chat-sug],[data-chat-clear],[data-prop]');if(!t)return;const d=t.dataset;
 if(d.chatOpen!==undefined)openChat(d.chatOpen);else if(t.hasAttribute('data-chat-close')){$('#chat').style.display='none'}else if(t.hasAttribute('data-chat-send'))doSend();else if(d.chatSug!==undefined)doSend(SUG[CSCOPE==='general'?'general':'ses'][+d.chatSug]);
 else if(t.hasAttribute('data-chat-clear')){if(confirm('¿Borrar esta conversación?')){CHAT=CHAT.filter(m=>m.scope!==CSCOPE);saveChat();cloud('coach_chat',(q,u)=>q.delete().eq('user_id',u).eq('scope',CSCOPE));CERR='';chatMsgs()}}
 else if(d.prop){const [mid,i,mode]=d.prop.split('|');applyProp(mid,+i,mode)}});

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.tab){tab=d.tab;render();scrollTo(0,0)}else if(d.cal){calMode=d.cal;render()}else if(d.cm!=null){const [y,m]=cmo.split('-').map(Number),n=new Date(y,m-1+ +d.cm,1);cmo=iso(n).slice(0,7);render()}else if(d.cd){cd=d.cd;render()}else if(d.edit)openEdit(d.edit);else if(d.metric)openMetric(d.metric);else if(d.range){METRIC.range=+d.range;metricSheet()}else if(d.open)openS(d.open);else if(d.w)openW(d.w);else if(d.linkSession)linkWS(d.linkSession,d.linkWorkout);else if(d.unl){delete links[d.unl];persist();const l=logs[d.unl];if(l)pushLog(l);const w=W.find(w=>$('#sheet').dataset.w==w.id);openW($('#sheet').dataset.w)}
 else if(d.rec){const [id,st]=d.rec.split('|');const r=recs.find(x=>x.id===id);r.status=st;r.date_ok=today();persist();pushRec(r);render()}
 else if(d.link)bindWorkout(SID,d.link,false)
 else if(d.rpe){D.rpe=+d.rpe;sheet()}else if(d.pain){D.pain=+d.pain;sheet()}
 else if(d.add!=null){const n=[...exercises(byId(SID)),...(D.extra||[]).map(n=>({n}))][d.add].n;D.sets[n].push({kg:'',reps:''});sheet()}
 else if(d.copy!=null){const n=[...exercises(byId(SID)),...(D.extra||[]).map(n=>({n}))][d.copy].n,v=D.sets[n],last=[...v].reverse().find(x=>x.kg||x.reps);if(last){const i=v.findIndex(x=>!x.kg&&!x.reps);i<0?v.push({...last}):v[i]={...last};sheet()}}
 else if(d.del){const [xi,i]=d.del.split('|').map(Number),n=[...exercises(byId(SID)),...(D.extra||[]).map(n=>({n}))][xi].n;D.sets[n].splice(i,1);sheet()}
 else if(d.act==='close'||d.act==='canceledit')closeS();else if(d.act==='saveedit')savePlanEdit();else if(d.act==='save')saveS('done');else if(d.act==='skip'){if(confirm('¿Marcar esta sesión como NO realizada?\n\nNo contará como entrenamiento hecho en tu cumplimiento. Podrás cambiarlo después guardándola con tus datos.'))saveS('skipped')}
 else if(d.act==='unlink'){delete links[SID];persist();if(logs[SID])pushLog(logs[SID]);toast('Vínculo eliminado');sheet()}else if(d.act==='nosug'){D._sug=null;sheet()}
 else if(d.act==='addex'){const n=prompt('Nombre del ejercicio');if(n){(D.extra=D.extra||[]).push(n.trim());D.sets[n.trim()]=[{kg:'',reps:''},{kg:'',reps:''},{kg:'',reps:''}];sheet()}}
 else if(d.act==='acct'){$('#dlg').showModal()}
 else if(d.act==='copy'){const tx=`Actúa como entrenador prudente de HYROX. Con estos datos reales, valora mi progresión y propón ajustes concretos y justificados (no inventes métricas).\n\n`+Object.values(logs).sort((a,b)=>a.date.localeCompare(b.date)).slice(-12).map(l=>`${l.date} ${l.title}: ${l.duration||'?'} min, RPE ${l.rpe||'?'}, molestias ${l.pain||0}/3. ${l.weights||''} ${l.notes||''}`).join('\n');navigator.clipboard.writeText(tx).then(()=>toast('Resumen copiado'))}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.pf&&EDIT){EDIT.s[t.dataset.pf]=t.type==='number'?(t.value===''?'':+t.value):t.value}else if(t.dataset.s){const [xi,i,f]=t.dataset.s.split('|'),n=[...exercises(byId(SID)),...(D.extra||[]).map(n=>({n}))][xi].n;D.sets[n][i][f]=t.value}else if(t.dataset.f&&D)D[t.dataset.f]=t.type==='number'?(t.value===''?null:+t.value):t.value});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.pf&&EDIT)EDIT.s[t.dataset.pf]=t.value;else if(t.dataset.sel!==undefined){exSel=t.value;render()}});

/* ---------- cuenta ---------- */
$('#showpw').onchange=e=>{$('#pw').type=e.target.checked?'text':'password'};
$('#cl').onclick=()=>$('#dlg').close();
$('#lf').onsubmit=async e=>{e.preventDefault();$('#ast').textContent='Entrando…';const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)$('#ast').textContent='No se pudo entrar: '+error.message;else $('#dlg').close()};
$('#lo').onclick=async()=>{await sb.auth.signOut();$('#dlg').close()};
function onSess(s){user=s?.user||null;$('#ast').textContent=user?'Sesión iniciada: '+user.email:'Inicia sesión para sincronizar entre dispositivos.';$('#lfields').hidden=!!user;$('#lo').hidden=!user;render();if(user)pull()}
sb.auth.getSession().then(({data})=>onSess(data.session));sb.auth.onAuthStateChange((_e,s)=>onSess(s));
render();
</script></body></html>
